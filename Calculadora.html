<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Científica</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calculadora {
            background: rgba(30, 30, 50, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 24px;
            border-radius: 24px;
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            width: 380px;
        }

        /* ---- Pantalla ---- */
        .pantalla-container {
            background: linear-gradient(145deg, #1a1a2e, #16162a);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 20px 22px;
            margin-bottom: 20px;
            text-align: right;
            box-shadow:
                inset 0 4px 12px rgba(0, 0, 0, 0.4),
                0 1px 0 rgba(255, 255, 255, 0.05);
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .historial {
            font-size: 15px;
            color: #7c7c9a;
            min-height: 22px;
            font-weight: 400;
            letter-spacing: 0.5px;
            transition: color 0.3s;
        }

        .pantalla {
            font-size: 42px;
            color: #eaeaff;
            margin: 6px 0 0 0;
            overflow-x: auto;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 0 20px rgba(120, 120, 255, 0.15);
        }

        /* ---- Grid de botones ---- */
        .botones {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        /* ---- Botón base ---- */
        button {
            font-family: 'Inter', sans-serif;
            font-size: 17px;
            padding: 16px 8px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.15s ease;
            position: relative;
            overflow: hidden;
        }

        button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }

        button:active::after {
            width: 200px;
            height: 200px;
        }

        button:active {
            transform: scale(0.92);
        }

        /* ---- Botones numéricos ---- */
        .btn-numero {
            background: linear-gradient(145deg, #2d2d4a, #252542);
            color: #e0e0f0;
            box-shadow:
                0 4px 8px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .btn-numero:hover {
            background: linear-gradient(145deg, #383860, #303050);
            box-shadow:
                0 6px 14px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        /* ---- Botones de operador ---- */
        .btn-operador {
            background: linear-gradient(145deg, #f5a623, #e8961a);
            color: white;
            box-shadow:
                0 4px 12px rgba(245, 166, 35, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .btn-operador:hover {
            background: linear-gradient(145deg, #ffb740, #f5a623);
            box-shadow:
                0 6px 18px rgba(245, 166, 35, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        /* ---- Botones científicos ---- */
        .btn-cientifico {
            background: linear-gradient(145deg, #3a3a5c, #2f2f4e);
            color: #a8a8cc;
            box-shadow:
                0 4px 8px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .btn-cientifico:hover {
            background: linear-gradient(145deg, #484870, #3d3d60);
            color: #d0d0ee;
            box-shadow:
                0 6px 14px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* ---- Botón Clear ---- */
        .btn-clear {
            background: linear-gradient(145deg, #e0465a, #c93a4d);
            color: white;
            box-shadow:
                0 4px 12px rgba(224, 70, 90, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .btn-clear:hover {
            background: linear-gradient(145deg, #f0556a, #e0465a);
            box-shadow:
                0 6px 18px rgba(224, 70, 90, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        /* ---- Botón Borrar ---- */
        .btn-borrar {
            background: linear-gradient(145deg, #e67e22, #d4711d);
            color: white;
            box-shadow:
                0 4px 12px rgba(230, 126, 34, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .btn-borrar:hover {
            background: linear-gradient(145deg, #f09030, #e67e22);
            box-shadow:
                0 6px 18px rgba(230, 126, 34, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        /* ---- Botón Igual ---- */
        .btn-igual {
            background: linear-gradient(145deg, #4ade80, #22c55e);
            color: #064e1d;
            grid-column: span 2;
            box-shadow:
                0 4px 14px rgba(34, 197, 94, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            font-size: 22px;
        }

        .btn-igual:hover {
            background: linear-gradient(145deg, #5eeb90, #4ade80);
            box-shadow:
                0 6px 22px rgba(34, 197, 94, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body>

    <div class="calculadora">
        <div class="pantalla-container">
            <div class="historial" id="historial"></div>
            <div class="pantalla" id="pantalla">0</div>
        </div>

        <div class="botones">
            <!-- Fila 1: Científico + Números + Operador -->
            <button class="btn-cientifico" onclick="procesarInstantaneo('sin')">sin</button>
            <button class="btn-numero" onclick="procesarNumero('7')">7</button>
            <button class="btn-numero" onclick="procesarNumero('8')">8</button>
            <button class="btn-numero" onclick="procesarNumero('9')">9</button>
            <button class="btn-operador" onclick="procesarOperador('/')">÷</button>

            <!-- Fila 2 -->
            <button class="btn-cientifico" onclick="procesarInstantaneo('cos')">cos</button>
            <button class="btn-numero" onclick="procesarNumero('4')">4</button>
            <button class="btn-numero" onclick="procesarNumero('5')">5</button>
            <button class="btn-numero" onclick="procesarNumero('6')">6</button>
            <button class="btn-operador" onclick="procesarOperador('*')">×</button>

            <!-- Fila 3 -->
            <button class="btn-cientifico" onclick="procesarInstantaneo('tan')">tan</button>
            <button class="btn-numero" onclick="procesarNumero('1')">1</button>
            <button class="btn-numero" onclick="procesarNumero('2')">2</button>
            <button class="btn-numero" onclick="procesarNumero('3')">3</button>
            <button class="btn-operador" onclick="procesarOperador('-')">−</button>

            <!-- Fila 4 -->
            <button class="btn-cientifico" onclick="procesarInstantaneo('sqrt')">√x</button>
            <button class="btn-clear" onclick="limpiar()">C</button>
            <button class="btn-numero" onclick="procesarNumero('0')">0</button>
            <button class="btn-numero" onclick="procesarNumero('.')">.</button>
            <button class="btn-operador" onclick="procesarOperador('+')">+</button>

            <!-- Fila 5 -->
            <button class="btn-cientifico" onclick="procesarInstantaneo('sqr')">x²</button>
            <button class="btn-cientifico" onclick="procesarNumero('3.14159265')">π</button>
            <button class="btn-borrar" onclick="borrarUltimo()">⌫</button>
            <button class="btn-igual" onclick="calcularResultado()">=</button>
        </div>
    </div>

    <script>
        let valorAnterior = 0;
        let operadorActual = "";
        let inicioNuevoNumero = true;
        let operadorPresionado = false;

        const elHistorial = document.getElementById("historial");
        const elPantalla = document.getElementById("pantalla");

        function formatNumero(numero) {
            let num = parseFloat(numero.toFixed(10));
            return num.toString();
        }

        function procesarNumero(numero) {
            if (inicioNuevoNumero) {
                if (numero === ".") {
                    elPantalla.innerText = "0.";
                } else {
                    elPantalla.innerText = numero;
                }

                if (operadorPresionado) {
                    let opVisual = operadorActual;
                    if (opVisual === '*') opVisual = '×';
                    if (opVisual === '/') opVisual = '÷';
                    if (opVisual === '-') opVisual = '−';
                    elHistorial.innerText = formatNumero(valorAnterior) + " " + opVisual;
                    operadorPresionado = false;
                } else {
                    elHistorial.innerText = "";
                }
                inicioNuevoNumero = false;
            } else {
                if (numero === ".") {
                    if (!elPantalla.innerText.includes(".")) {
                        elPantalla.innerText += ".";
                    }
                } else {
                    if (elPantalla.innerText === "0") {
                        elPantalla.innerText = numero;
                    } else {
                        elPantalla.innerText += numero;
                    }
                }
            }
        }

        function procesarOperador(operador) {
            if (!inicioNuevoNumero) {
                calcularIntermedio();
            }
            operadorActual = operador;
            valorAnterior = parseFloat(elPantalla.innerText);
            operadorPresionado = true;
            inicioNuevoNumero = true;
        }

        function procesarInstantaneo(operacion) {
            let valorActual = parseFloat(elPantalla.innerText);
            let resultado = 0;
            let simbolo = "";

            switch (operacion) {
                case 'sin':
                    resultado = Math.sin(valorActual * Math.PI / 180);
                    simbolo = `sin(${valorActual})`;
                    break;
                case 'cos':
                    resultado = Math.cos(valorActual * Math.PI / 180);
                    simbolo = `cos(${valorActual})`;
                    break;
                case 'tan':
                    resultado = Math.tan(valorActual * Math.PI / 180);
                    simbolo = `tan(${valorActual})`;
                    break;
                case 'sqrt':
                    if (valorActual < 0) {
                        elPantalla.innerText = "Error";
                        inicioNuevoNumero = true;
                        return;
                    }
                    resultado = Math.sqrt(valorActual);
                    simbolo = `√(${valorActual})`;
                    break;
                case 'sqr':
                    resultado = Math.pow(valorActual, 2);
                    simbolo = `sqr(${valorActual})`;
                    break;
            }

            elHistorial.innerText = simbolo;
            elPantalla.innerText = formatNumero(resultado);
            inicioNuevoNumero = true;
        }

        function calcularIntermedio() {
            if (operadorActual !== "" && !operadorPresionado) {
                let valorActual = parseFloat(elPantalla.innerText);
                let resultado = realizarOperacion(valorAnterior, valorActual, operadorActual);
                elPantalla.innerText = formatNumero(resultado);
                valorAnterior = resultado;
            }
        }

        function calcularResultado() {
            if (operadorActual !== "") {
                let valorActual = parseFloat(elPantalla.innerText);
                let resultado = realizarOperacion(valorAnterior, valorActual, operadorActual);

                let opVisual = operadorActual;
                if (opVisual === '*') opVisual = '×';
                if (opVisual === '/') opVisual = '÷';
                if (opVisual === '-') opVisual = '−';

                elHistorial.innerText = formatNumero(valorAnterior) + " " + opVisual + " " + formatNumero(valorActual) + " =";
                elPantalla.innerText = formatNumero(resultado);

                operadorActual = "";
                inicioNuevoNumero = true;
                operadorPresionado = false;
            }
        }

        function realizarOperacion(v1, v2, op) {
            switch (op) {
                case "+": return v1 + v2;
                case "-": return v1 - v2;
                case "*": return v1 * v2;
                case "/": return v2 !== 0 ? v1 / v2 : 0;
                default: return v2;
            }
        }

        function limpiar() {
            elPantalla.innerText = "0";
            elHistorial.innerText = "";
            valorAnterior = 0;
            operadorActual = "";
            inicioNuevoNumero = true;
            operadorPresionado = false;
        }

        function borrarUltimo() {
            if (inicioNuevoNumero) return;

            let textoActual = elPantalla.innerText;
            if (textoActual === "Error") {
                limpiar();
                return;
            }

            if (textoActual.length > 1 && !(textoActual.length === 2 && textoActual.startsWith("-"))) {
                elPantalla.innerText = textoActual.slice(0, -1);
            } else {
                elPantalla.innerText = "0";
                inicioNuevoNumero = true;
            }
        }
    </script>
</body>

</html>
