<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Científica</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calculadora {
            background-color: #34495e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 350px;
        }

        .pantalla-container {
            background-color: #ecf0f1;
            border: 2px solid #2c3e50;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: right;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        .historial {
            font-size: 16px;
            color: #7f8c8d;
            min-height: 20px;
        }

        .pantalla {
            font-size: 40px;
            color: #2c3e50;
            margin: 5px 0 0 0;
            overflow-x: auto;
            font-weight: bold;
        }

        .botones {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        button {
            font-size: 18px;
            padding: 15px 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #ecf0f1;
            color: #2c3e50;
            transition: all 0.2s ease;
            font-weight: bold;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            background-color: #bdc3c7;
        }

        .btn-operador {
            background-color: #f39c12;
            color: white;
        }

        .btn-operador:hover {
            background-color: #e67e22;
        }

        .btn-cientifico {
            background-color: #95a5a6;
            color: white;
        }

        .btn-cientifico:hover {
            background-color: #7f8c8d;
        }

        .btn-clear {
            background-color: #e74c3c;
            color: white;
        }

        .btn-clear:hover {
            background-color: #c0392b;
        }

        .btn-borrar {
            background-color: #e67e22;
            color: white;
        }

        .btn-borrar:hover {
            background-color: #d35400;
        }

        .btn-igual {
            background-color: #2ecc71;
            color: white;
            grid-column: span 3;
        }

        .btn-igual:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="calculadora">
        <div class="pantalla-container">
            <div class="historial" id="historial"></div>
            <div class="pantalla" id="pantalla">0</div>
        </div>

        <div class="botones">
            <!-- Fila 1 -->
            <button class="btn-cientifico" onclick="procesarInstantaneo('sin')">sin</button>
            <button onclick="procesarNumero('7')">7</button>
            <button onclick="procesarNumero('8')">8</button>
            <button onclick="procesarNumero('9')">9</button>
            <button class="btn-operador" onclick="procesarOperador('/')">÷</button>

            <!-- Fila 2 -->
            <button class="btn-cientifico" onclick="procesarInstantaneo('cos')">cos</button>
            <button onclick="procesarNumero('4')">4</button>
            <button onclick="procesarNumero('5')">5</button>
            <button onclick="procesarNumero('6')">6</button>
            <button class="btn-operador" onclick="procesarOperador('*')">×</button>

            <!-- Fila 3 -->
            <button class="btn-cientifico" onclick="procesarInstantaneo('tan')">tan</button>
            <button onclick="procesarNumero('1')">1</button>
            <button onclick="procesarNumero('2')">2</button>
            <button onclick="procesarNumero('3')">3</button>
            <button class="btn-operador" onclick="procesarOperador('-')">−</button>

            <!-- Fila 4 -->
            <button class="btn-cientifico" onclick="procesarInstantaneo('sqrt')">√x</button>
            <button class="btn-clear" onclick="limpiar()">C</button>
            <button onclick="procesarNumero('0')">0</button>
            <button onclick="procesarNumero('.')">.</button>
            <button class="btn-operador" onclick="procesarOperador('+')">+</button>

            <!-- Fila 5 -->
            <button class="btn-cientifico" onclick="procesarInstantaneo('sqr')">x²</button>
            <button class="btn-cientifico" onclick="procesarNumero('3.14159265')">π</button>
            <button class="btn-borrar" onclick="borrarUltimo()">⌫</button>
            <button class="btn-igual" onclick="calcularResultado()" style="grid-column: span 2;">=</button>
        </div>
    </div>

    <script>
        let valorAnterior = 0;
        let operadorActual = "";
        let inicioNuevoNumero = true;
        let operadorPresionado = false;

        const elHistorial = document.getElementById("historial");
        const elPantalla = document.getElementById("pantalla");

        function formatNumero(numero) {
            let num = parseFloat(numero.toFixed(10));
            return num.toString();
        }

        function procesarNumero(numero) {
            if (inicioNuevoNumero) {
                if (numero === ".") {
                    elPantalla.innerText = "0.";
                } else {
                    elPantalla.innerText = numero;
                }
                
                // Requisito: que el número anterior suba arriba
                if (operadorPresionado) {
                    let opVisual = operadorActual;
                    if(opVisual === '*') opVisual = '×';
                    if(opVisual === '/') opVisual = '÷';
                    if(opVisual === '-') opVisual = '−';
                    elHistorial.innerText = formatNumero(valorAnterior) + " " + opVisual;
                    operadorPresionado = false;
                } else {
                    elHistorial.innerText = "";
                }
                inicioNuevoNumero = false;
            } else {
                if (numero === ".") {
                    if (!elPantalla.innerText.includes(".")) {
                        elPantalla.innerText += ".";
                    }
                } else {
                    if (elPantalla.innerText === "0") {
                        elPantalla.innerText = numero;
                    } else {
                        elPantalla.innerText += numero;
                    }
                }
            }
        }

        function procesarOperador(operador) {
            if (!inicioNuevoNumero) {
                calcularIntermedio();
            }
            operadorActual = operador;
            valorAnterior = parseFloat(elPantalla.innerText);
            operadorPresionado = true;
            inicioNuevoNumero = true;
            // El signo NO aparece de inmediato, se guarda en memoria
        }

        function procesarInstantaneo(operacion) {
            let valorActual = parseFloat(elPantalla.innerText);
            let resultado = 0;
            let simbolo = "";

            switch(operacion) {
                case 'sin':
                    resultado = Math.sin(valorActual * Math.PI / 180); // Calculado en grados
                    simbolo = `sin(${valorActual})`;
                    break;
                case 'cos':
                    resultado = Math.cos(valorActual * Math.PI / 180); // Calculado en grados
                    simbolo = `cos(${valorActual})`;
                    break;
                case 'tan':
                    resultado = Math.tan(valorActual * Math.PI / 180); // Calculado en grados
                    simbolo = `tan(${valorActual})`;
                    break;
                case 'sqrt':
                    if (valorActual < 0) {
                        elPantalla.innerText = "Error";
                        inicioNuevoNumero = true;
                        return;
                    }
                    resultado = Math.sqrt(valorActual);
                    simbolo = `√(${valorActual})`;
                    break;
                case 'sqr':
                    resultado = Math.pow(valorActual, 2);
                    simbolo = `sqr(${valorActual})`;
                    break;
            }

            elHistorial.innerText = simbolo;
            elPantalla.innerText = formatNumero(resultado);
            inicioNuevoNumero = true;
        }

        function calcularIntermedio() {
            if (operadorActual !== "" && !operadorPresionado) {
                let valorActual = parseFloat(elPantalla.innerText);
                let resultado = realizarOperacion(valorAnterior, valorActual, operadorActual);
                elPantalla.innerText = formatNumero(resultado);
                valorAnterior = resultado;
            }
        }

        function calcularResultado() {
            if (operadorActual !== "") {
                let valorActual = parseFloat(elPantalla.innerText);
                let resultado = realizarOperacion(valorAnterior, valorActual, operadorActual);
                
                let opVisual = operadorActual;
                if(opVisual === '*') opVisual = '×';
                if(opVisual === '/') opVisual = '÷';
                if(opVisual === '-') opVisual = '−';

                elHistorial.innerText = formatNumero(valorAnterior) + " " + opVisual + " " + formatNumero(valorActual) + " =";
                elPantalla.innerText = formatNumero(resultado);
                
                operadorActual = "";
                inicioNuevoNumero = true;
                operadorPresionado = false;
            }
        }

        function realizarOperacion(v1, v2, op) {
            switch (op) {
                case "+": return v1 + v2;
                case "-": return v1 - v2;
                case "*": return v1 * v2;
                case "/": return v2 !== 0 ? v1 / v2 : 0;
                default: return v2;
            }
        }

        function limpiar() {
            elPantalla.innerText = "0";
            elHistorial.innerText = "";
            valorAnterior = 0;
            operadorActual = "";
            inicioNuevoNumero = true;
            operadorPresionado = false;
        }

        function borrarUltimo() {
            // Si apenas terminamos una operación o recién empezamos, no borramos caracter por caracter
            if (inicioNuevoNumero) return; 
            
            let textoActual = elPantalla.innerText;
            if (textoActual === "Error") {
                limpiar();
                return;
            }

            // Si tiene más de 1 caracter, borramos el último. 
            // Si tiene el signo de menos y un dígito (ej: -5), volver a 0
            if (textoActual.length > 1 && !(textoActual.length === 2 && textoActual.startsWith("-"))) {
                elPantalla.innerText = textoActual.slice(0, -1);
            } else {
                elPantalla.innerText = "0";
                inicioNuevoNumero = true;
            }
        }
    </script>
</body>
</html>
